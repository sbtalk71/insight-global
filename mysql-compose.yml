services:
  mysql-db:
    image: mysql:8.0-oraclelinux9
    container_name: mysql-server
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    networks: 
     - my_network
    volumes: 
     - mysql-volume:/var/lib/mysql
networks:
   my_network:
     driver: bridge
volumes:
    mysql-volume:
