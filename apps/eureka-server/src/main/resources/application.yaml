spring:
  application:
    name: eureka-server
  cloud:
    inetutils:
      preferred-networks: 127.0.0.1,lambda
server:
  port: 8761

eureka:
  instance:
    hostname: 127.0.0.1
    prefer-ip-address: true

  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka/
